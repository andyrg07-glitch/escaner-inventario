<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Control de Inventario</title>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f3f5f9;
  color:#222;
}

.wrap{
  max-width:560px;
  margin:auto;
  padding:16px;
}

h1{
  font-size:23px;
  color:#3D558C;
  margin:8px 0 14px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 2px 10px #0001;
}

video{
  width:100%;
  min-height:260px;
  background:#111;
  border-radius:12px;
  object-fit:cover;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#3D558C;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  margin-top:8px;
  cursor:pointer;
}

button.secondary{
  background:#666;
}

input,select{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin:5px 0 12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
}

label{
  font-weight:bold;
  font-size:14px;
}

.status{
  padding:11px;
  border-radius:9px;
  margin-top:10px;
  font-size:14px;
}

.ok{
  background:#e4f4e1;
}

.warn{
  background:#fff0c7;
}

.err{
  background:#f8d7da;
}

.hidden{
  display:none;
}

.small{
  font-size:12px;
  color:#666;
}

.scannerInput{
  font-size:22px;
  font-weight:bold;
  text-align:center;
  border:2px solid #3D558C;
  background:#f8faff;
}

.producto{
  font-size:18px;
  font-weight:bold;
}

.stock{
  text-align:center;
  background:#eef2fa;
  border-radius:12px;
  padding:15px;
  margin:10px 0;
}

.stockNumber{
  font-size:36px;
  font-weight:bold;
  color:#3D558C;
}

.mode{
  font-size:18px;
  font-weight:bold;
}

.checkline{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:5px;
  margin-bottom:8px;
}

.checkline input{
  width:auto;
  margin:0;
}
</style>
</head>

<body>

<div class="wrap">

<h1>📦 CONTROL DE INVENTARIO</h1>


<!-- =========================
     LECTOR FÍSICO
========================= -->

<div class="card">

  <label>🔫 LECTOR USB / BLUETOOTH</label>

  <input
    id="scannerInput"
    class="scannerInput"
    autocomplete="off"
    inputmode="none"
    placeholder="ESCANEA AQUÍ"
  >

  <div class="small">
    El lector CHAOAO escribirá aquí el código y enviará Enter automáticamente.
  </div>

</div>


<!-- =========================
     MODO
========================= -->

<div class="card">

  <label>MODO DE OPERACIÓN</label>

  <select id="modo" class="mode">
    <option value="CONSULTA">🔎 CONSULTA</option>
    <option value="ENTRADA">📥 ENTRADA</option>
    <option value="SALIDA">📤 SALIDA</option>
    <option value="AJUSTE">⚙️ AJUSTE</option>
  </select>

  <label>Cantidad por escaneo</label>

  <input
    id="cantidadRapida"
    type="number"
    min="0.01"
    step="0.01"
    value="1"
  >

  <div class="checkline">
    <input type="checkbox" id="automatico">
    <label for="automatico">
      Registrar automáticamente después de escanear
    </label>
  </div>

  <div class="small">
    Primero prueba con el registro automático desactivado.
  </div>

</div>


<!-- =========================
     CÁMARA
========================= -->

<div class="card">

  <video id="video" autoplay playsinline muted></video>

  <label for="cameraSelect">Cámara</label>
  <select id="cameraSelect"></select>

  <button id="scanBtn" onclick="startCamera()">
    📷 ABRIR CÁMARA
  </button>

  <button
    id="stopBtn"
    class="secondary hidden"
    onclick="stopCamera()"
  >
    DETENER CÁMARA
  </button>

  <div id="status"></div>

</div>


<!-- =========================
     INFORMACIÓN DEL PRODUCTO
========================= -->

<div class="card">

  <label>Código de barras</label>
  <input id="barcode" readonly>

  <label>Clave</label>
  <input id="clave" placeholder="Clave del producto">

  <label>Producto</label>
  <input id="producto" class="producto" readonly>


  <div id="stockBox" class="stock hidden">

    <div>EXISTENCIA ACTUAL</div>

    <div id="existencia" class="stockNumber">
      0
    </div>

    <div id="estado"></div>

  </div>


  <!-- ALTA DE CÓDIGO -->

  <div id="altaBox" class="hidden">

    <div class="status warn">
      ⚠️ Código nuevo. Captura la CLAVE para relacionarlo con un producto.
    </div>

    <button onclick="alta()">
      ➕ DAR DE ALTA CÓDIGO
    </button>

  </div>


  <!-- MOVIMIENTO -->

  <div id="movBox" class="hidden">

    <label>Cantidad</label>

    <input
      id="cantidad"
      type="number"
      min="0.01"
      step="0.01"
      value="1"
    >

    <label>Usuario</label>
    <input id="usuario" placeholder="Nombre">

    <label>Referencia</label>
    <input id="referencia" placeholder="Ej. compra, venta, ajuste">

    <label>Observaciones</label>
    <input id="observaciones">

    <button onclick="registrar()">
      ✅ REGISTRAR MOVIMIENTO
    </button>

  </div>

</div>

</div>


<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

<script>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const API =
'https://script.google.com/macros/s/AKfycbwQMousq8gdmOt_9ZzKp28NoG5ZLzuoskzGDDif5pBIkIbb6AvtryBPcOaD4x2xIUoZoQ/exec';


let stream = null;
let scanning = false;
let codeReader = null;
let scanTimer = null;
let processing = false;


const video =
document.getElementById('video');

const cameraSelect =
document.getElementById('cameraSelect');

const scannerInput =
document.getElementById('scannerInput');


/* =====================================================
   INTERFAZ
===================================================== */

function showStatus(text, cls='ok'){

  document.getElementById('status').innerHTML =
    '<div class="status ' + cls + '">' +
    text +
    '</div>';

}


function altaBox(show){

  document
    .getElementById('altaBox')
    .classList.toggle('hidden', !show);

}


function movBox(show){

  document
    .getElementById('movBox')
    .classList.toggle('hidden', !show);

}


function stockBox(show){

  document
    .getElementById('stockBox')
    .classList.toggle('hidden', !show);

}


/* =====================================================
   CONEXIÓN APPS SCRIPT - JSONP
===================================================== */

function jsonp(url){

  return new Promise((resolve,reject)=>{

    const callbackName =
      'cb_' +
      Date.now() +
      '_' +
      Math.floor(Math.random()*100000);

    const script =
      document.createElement('script');

    let finished = false;


    const timeout = setTimeout(()=>{

      if(finished) return;

      finished = true;

      cleanup();

      reject(
        new Error(
          'Tiempo de espera agotado al conectar con Apps Script'
        )
      );

    },20000);


    window[callbackName] = function(data){

      if(finished) return;

      finished = true;

      cleanup();

      resolve(data);

    };


    function cleanup(){

      clearTimeout(timeout);

      try{
        delete window[callbackName];
      }catch(e){}

      if(script.parentNode){
        script.parentNode.removeChild(script);
      }

    }


    const separator =
      url.includes('?') ? '&' : '?';


    script.src =
      url +
      separator +
      'callback=' +
      encodeURIComponent(callbackName) +
      '&_ts=' +
      Date.now();


    script.async = true;


    script.onerror = function(){

      if(finished) return;

      finished = true;

      cleanup();

      reject(
        new Error(
          'No se pudo conectar con Apps Script'
        )
      );

    };


    document.head.appendChild(script);

  });

}


/* =====================================================
   LECTOR FÍSICO CHAOAO
===================================================== */

scannerInput.addEventListener(
'keydown',
async function(event){

  if(event.key !== 'Enter'){
    return;
  }

  event.preventDefault();


  const code =
    String(scannerInput.value || '').trim();


  scannerInput.value = '';


  if(!code){
    return;
  }


  await onCode(code, true);

});


/* =====================================================
   CONSULTAR CÓDIGO
===================================================== */

async function onCode(code, physical=false){

  code =
    String(code || '').trim();


  if(!code){
    return;
  }


  if(processing){
    return;
  }


  processing = true;


  if(!physical){
    await stopCamera();
  }


  document.getElementById('barcode').value =
    code;

  document.getElementById('clave').value =
    '';

  document.getElementById('producto').value =
    '';

  document.getElementById('existencia').textContent =
    '0';

  document.getElementById('estado').textContent =
    '';


  altaBox(false);
  movBox(false);
  stockBox(false);


  showStatus(
    '🔎 Código leído: ' +
    code +
    '. Buscando producto...'
  );


  try{

    const url =
      API +
      '?action=lookup' +
      '&barcode=' +
      encodeURIComponent(code);


    const r =
      await jsonp(url);


    console.log(
      'Respuesta de Apps Script:',
      r
    );


    if(r && r.ok === true){

      document.getElementById('clave').value =
        r.clave || '';

      document.getElementById('producto').value =
        r.producto || '';

      document.getElementById('existencia').textContent =
        Number(r.existencia || 0);

      document.getElementById('estado').textContent =
        r.estado || '';

      stockBox(true);


      const modo =
        document.getElementById('modo').value;


      if(modo === 'CONSULTA'){

        showStatus(
          '✅ ' +
          (r.producto || 'PRODUCTO') +
          ' | CLAVE: ' +
          (r.clave || '') +
          ' | EXISTENCIA: ' +
          Number(r.existencia || 0)
        );

      }

      else{

        movBox(true);


        const cantidadRapida =
          document
            .getElementById('cantidadRapida')
            .value || 1;


        document.getElementById('cantidad').value =
          cantidadRapida;


        showStatus(
          '✅ PRODUCTO RECONOCIDO: ' +
          (r.producto || '') +
          ' | EXISTENCIA: ' +
          Number(r.existencia || 0)
        );


        if(
          document
            .getElementById('automatico')
            .checked
        ){

          /*
            Liberamos processing para permitir
            que registrar() continúe.
          */

          processing = false;

          await registrar();

          return;

        }

      }

    }

    else{

      document.getElementById('clave').value =
        '';

      document.getElementById('producto').value =
        '';

      altaBox(true);


      showStatus(
        '⚠️ Código ' +
        code +
        ' no registrado. Captura la CLAVE.',
        'warn'
      );

    }

  }

  catch(error){

    console.error(error);


    showStatus(
      '❌ Error buscando producto: ' +
      error.message,
      'err'
    );

  }

  finally{

    processing = false;

    scannerInput.value = '';


    setTimeout(()=>{

      scannerInput.focus();

    },150);

  }

}


/* =====================================================
   ALTA DE CÓDIGO NUEVO
===================================================== */

async function alta(){

  const code =
    document
      .getElementById('barcode')
      .value
      .trim();


  const key =
    document
      .getElementById('clave')
      .value
      .trim();


  const user =
    document
      .getElementById('usuario')
      .value
      .trim();


  if(!code || !key){

    showStatus(
      '⚠️ Captura la CLAVE antes de dar de alta.',
      'warn'
    );

    return;

  }


  showStatus(
    'Registrando código...'
  );


  try{

    const url =
      API +
      '?action=alta' +
      '&barcode=' +
      encodeURIComponent(code) +
      '&clave=' +
      encodeURIComponent(key) +
      '&usuario=' +
      encodeURIComponent(user);


    const r =
      await jsonp(url);


    if(r && r.ok === true){

      document.getElementById('producto').value =
        r.producto || '';

      altaBox(false);


      showStatus(
        '✅ Código dado de alta correctamente.'
      );


      /*
        Volvemos a consultar para cargar
        existencia y estado.
      */

      await onCode(code, true);

    }

    else{

      showStatus(
        (r && r.message)
        ? r.message
        : 'No se pudo dar de alta.',
        'err'
      );

    }

  }

  catch(error){

    showStatus(
      '❌ ' + error.message,
      'err'
    );

  }

}


/* =====================================================
   REGISTRAR MOVIMIENTO
===================================================== */

async function registrar(){

  if(processing){
    return;
  }


  processing = true;


  const tipo =
    document.getElementById('modo').value;


  const barcode =
    document.getElementById('barcode').value.trim();


  const cantidad =
    Number(
      document.getElementById('cantidad').value
    );


  const existenciaAntes =
    Number(
      document.getElementById('existencia').textContent || 0
    );


  if(tipo === 'CONSULTA'){

    processing = false;

    showStatus(
      '⚠️ Selecciona ENTRADA, SALIDA o AJUSTE.',
      'warn'
    );

    return;

  }


  if(!barcode){

    processing = false;

    showStatus(
      '⚠️ Primero escanea un producto.',
      'warn'
    );

    return;

  }


  if(!Number.isFinite(cantidad) || cantidad <= 0){

    processing = false;

    showStatus(
      '⚠️ La cantidad debe ser mayor a 0.',
      'warn'
    );

    return;

  }


  if(
    tipo === 'SALIDA' &&
    cantidad > existenciaAntes
  ){

    processing = false;

    showStatus(
      '❌ EXISTENCIA INSUFICIENTE. Disponible: ' +
      existenciaAntes +
      ' | Intentas retirar: ' +
      cantidad,
      'err'
    );

    scannerInput.focus();

    return;

  }


  const params =
    new URLSearchParams({

      action:'register',

      barcode:barcode,

      tipo:tipo,

      cantidad:String(cantidad),

      usuario:
        document.getElementById('usuario').value,

      referencia:
        document.getElementById('referencia').value,

      observaciones:
        document.getElementById('observaciones').value

    });


  showStatus(
    'Guardando movimiento...'
  );


  try{

    const r =
      await jsonp(
        API + '?' + params.toString()
      );


    if(r && r.ok === true){

      let nuevaExistencia =
        existenciaAntes;


      if(tipo === 'ENTRADA'){
        nuevaExistencia += cantidad;
      }


      if(tipo === 'SALIDA'){
        nuevaExistencia -= cantidad;
      }


      if(tipo === 'AJUSTE'){
        nuevaExistencia += cantidad;
      }


      document.getElementById('existencia').textContent =
        nuevaExistencia;


      showStatus(
        '✅ MOVIMIENTO REGISTRADO' +
        '<br>' +
        (r.producto || '') +
        '<br>' +
        tipo +
        ': ' +
        cantidad +
        '<br>' +
        'ANTES: ' +
        existenciaAntes +
        ' → AHORA: ' +
        nuevaExistencia
      );


      document.getElementById('cantidad').value =
        document
          .getElementById('cantidadRapida')
          .value || 1;


      document.getElementById('referencia').value =
        '';

      document.getElementById('observaciones').value =
        '';

    }

    else{

      showStatus(
        (r && r.message)
        ? r.message
        : 'No se pudo registrar el movimiento.',
        'err'
      );

    }

  }

  catch(error){

    showStatus(
      '❌ ' + error.message,
      'err'
    );

  }

  finally{

    processing = false;


    setTimeout(()=>{

      scannerInput.focus();

    },150);

  }

}


/* =====================================================
   CÁMARAS
===================================================== */

async function loadCameras(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    showStatus(
      'Este navegador no soporta acceso a cámara.',
      'err'
    );

    return;

  }


  try{

    const tmp =
      await navigator.mediaDevices.getUserMedia({
        video:true,
        audio:false
      });


    tmp.getTracks().forEach(
      track => track.stop()
    );


    const devices =
      await navigator.mediaDevices.enumerateDevices();


    const cameras =
      devices.filter(
        device => device.kind === 'videoinput'
      );


    cameraSelect.innerHTML = '';


    cameras.forEach((camera,index)=>{

      const option =
        document.createElement('option');


      option.value =
        camera.deviceId;


      option.textContent =
        camera.label ||
        ('Cámara ' + (index+1));


      cameraSelect.appendChild(option);

    });


    const rear =
      [...cameraSelect.options].find(
        option =>
          /back|rear|environment|trasera/i
          .test(option.textContent)
      );


    if(rear){
      cameraSelect.value = rear.value;
    }

  }

  catch(error){

    showStatus(
      'No se pudieron listar cámaras: ' +
      error.message,
      'err'
    );

  }

}


/* =====================================================
   ABRIR CÁMARA
===================================================== */

async function startCamera(){

  if(!window.isSecureContext){

    showStatus(
      'La cámara requiere HTTPS.',
      'err'
    );

    return;

  }


  await stopCamera();


  const deviceId =
    cameraSelect.value;


  const constraints = {

    video: deviceId
      ? {
          deviceId:{
            exact:deviceId
          },

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          }
        }

      : {
          facingMode:{
            ideal:'environment'
          },

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          }
        },

    audio:false

  };


  try{

    stream =
      await navigator.mediaDevices.getUserMedia(
        constraints
      );


    video.srcObject =
      stream;


    await video.play();


    document
      .getElementById('scanBtn')
      .classList.add('hidden');


    document
      .getElementById('stopBtn')
      .classList.remove('hidden');


    scanning = true;


    showStatus(
      '📷 Cámara activa. Buscando código...'
    );


    startBarcodeLoop();

  }

  catch(error){

    showStatus(
      'No se pudo abrir la cámara: ' +
      error.name +
      ' - ' +
      error.message,
      'err'
    );

  }

}


/* =====================================================
   DETENER CÁMARA
===================================================== */

async function stopCamera(){

  scanning = false;


  if(scanTimer){

    clearTimeout(scanTimer);

    scanTimer = null;

  }


  if(codeReader && codeReader.reset){

    try{
      codeReader.reset();
    }catch(e){}

  }


  if(stream){

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    stream = null;

  }


  video.srcObject = null;


  document
    .getElementById('scanBtn')
    .classList.remove('hidden');


  document
    .getElementById('stopBtn')
    .classList.add('hidden');

}


/* =====================================================
   LECTOR DE CÓDIGO POR CÁMARA
===================================================== */

async function startBarcodeLoop(){

  /*
    Primero intentamos BarcodeDetector
  */

  if('BarcodeDetector' in window){

    try{

      const supported =
        await BarcodeDetector.getSupportedFormats();


      const wanted = [
        'ean_13',
        'ean_8',
        'upc_a',
        'upc_e',
        'code_128',
        'code_39',
        'itf',
        'codabar'
      ];


      const formats =
        wanted.filter(
          format =>
            supported.includes(format)
        );


      const detector =
        new BarcodeDetector({
          formats:
            formats.length
            ? formats
            : undefined
        });


      const loop = async()=>{

        if(!scanning){
          return;
        }


        try{

          const codes =
            await detector.detect(video);


          if(codes && codes.length){

            const raw =
              String(
                codes[0].rawValue || ''
              ).trim();


            if(raw){

              await onCode(raw, false);

              return;

            }

          }

        }

        catch(e){}


        scanTimer =
          setTimeout(loop,180);

      };


      loop();

      return;

    }

    catch(e){}

  }


  /*
    Respaldo ZXing
  */

  try{

    codeReader =
      new ZXing.BrowserMultiFormatReader();


    const deviceId =
      cameraSelect.value || undefined;


    codeReader.decodeFromVideoDevice(

      deviceId,

      video,

      (result,error)=>{

        if(!scanning){
          return;
        }


        if(result){

          const raw =
            String(
              result.getText() || ''
            ).trim();


          if(raw){

            onCode(raw,false);

          }

        }

      }

    );

  }

  catch(error){

    showStatus(
      'La cámara abrió, pero no se pudo iniciar el lector: ' +
      error.message,
      'err'
    );

  }

}


/* =====================================================
   CAMBIO DE MODO
===================================================== */

document
.getElementById('modo')
.addEventListener('change',()=>{

  const modo =
    document.getElementById('modo').value;


  if(modo === 'CONSULTA'){

    movBox(false);

  }

  else if(
    document.getElementById('barcode').value
  ){

    movBox(true);

  }


  scannerInput.focus();

});


/* =====================================================
   INICIO
===================================================== */

window.addEventListener(
'load',
async()=>{

  await loadCameras();

  scannerInput.focus();


  showStatus(
    '✅ Sistema listo. Escanea un producto.'
  );

});


cameraSelect.addEventListener(
'change',
()=>{

  if(stream){
    startCamera();
  }

});

</script>

</body>
</html>
