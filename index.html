<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control de Inventario</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>
body{font-family:Arial;margin:0;background:#f3f5f9}.wrap{max-width:520px;margin:auto;padding:16px}h1{color:#3D558C}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}button{width:100%;padding:14px;border:0;border-radius:10px;background:#3D558C;color:#fff;font-size:17px;font-weight:bold;margin-top:8px}input,select{width:100%;box-sizing:border-box;padding:12px;margin:5px 0 12px;border:1px solid #ccc;border-radius:9px;font-size:16px}label{font-weight:bold;font-size:14px}#reader{width:100%;min-height:250px;background:#111;border-radius:12px;overflow:hidden}.status{padding:11px;border-radius:9px;margin-top:10px}.ok{background:#e4f4e1}.warn{background:#fff0c7}.err{background:#f8d7da}.hidden{display:none}</style></head><body><div class="wrap"><h1>📦 CONTROL DE INVENTARIO</h1><div class="card"><div id="reader"></div><button id="scan" onclick="start()">📷 ESCANEAR PRODUCTO</button><button id="stop" class="hidden" onclick="stop()">DETENER CÁMARA</button><div id="status"></div></div><div class="card"><label>Código de barras</label><input id="barcode" readonly><label>Clave</label><input id="clave"><label>Producto</label><input id="producto" readonly><div id="alta" class="hidden"><div class="status warn">Código nuevo. Captura la CLAVE.</div><button onclick="alta()">➕ DAR DE ALTA</button></div><div id="mov" class="hidden"><label>Movimiento</label><select id="tipo"><option>ENTRADA</option><option>SALIDA</option><option>AJUSTE</option></select><label>Cantidad</label><input id="cantidad" type="number" min="0.01" step="0.01" value="1"><label>Usuario</label><input id="usuario"><label>Referencia</label><input id="ref"><label>Observaciones</label><input id="obs"><button onclick="registrar()">✅ REGISTRAR MOVIMIENTO</button></div></div></div><script>
const API='https://script.google.com/macros/s/AKfycbwNTL-lEAtnikqH9V1Rd2MNuCrTCcfH7M6k96o9YfFwzyxw8473bWqZG2toDa1JEx6R/exec';let sc=null,run=false,last='';
function status(t,c='ok'){document.getElementById('status').innerHTML='<div class="status '+c+'">'+t+'</div>'}
function jsonp(url){return new Promise((res,rej)=>{const cb='cb'+Date.now();const s=document.createElement('script');const tm=setTimeout(()=>{clean();rej(Error('Tiempo de espera agotado'))},15000);window[cb]=x=>{clean();res(x)};function clean(){clearTimeout(tm);delete window[cb];s.remove()}s.src=url+'&callback='+cb;s.onerror=()=>{clean();rej(Error('No se pudo conectar con Apps Script'))};document.body.appendChild(s)})}
async function start(){if(!window.isSecureContext){status('La página debe abrirse por HTTPS.','err');return}sc=new Html5Qrcode('reader');run=true;scan.classList.add('hidden');stop.classList.remove('hidden');status('Apunta al código de barras...');try{await sc.start({facingMode:{ideal:'environment'}},{fps:10,qrbox:{width:300,height:140}},code=>found(code),()=>{})}catch(e){run=false;scan.classList.remove('hidden');stop.classList.add('hidden');status('No se pudo abrir la cámara: '+e,'err')}}
async function stop(){if(sc&&run)try{await sc.stop()}catch(e){}run=false;scan.classList.remove('hidden');stop.classList.add('hidden')}
async function found(code){code=String(code).trim();if(!code||code===last)return;last=code;await stop();barcode.value=code;altaBox(false);movBox(false);status('Buscando código...');try{const r=await jsonp(API+'?action=lookup&barcode='+encodeURIComponent(code));if(r.ok){clave.value=r.clave;producto.value=r.producto;movBox(true);status('✅ Producto reconocido')}else{clave.value='';producto.value='';altaBox(true);status('⚠️ Código nuevo. Captura la CLAVE.','warn')}}catch(e){status(e.message,'err')}}
function altaBox(x){document.getElementById('alta').classList.toggle('hidden',!x)}function movBox(x){document.getElementById('mov').classList.toggle('hidden',!x)}
async function alta(){status('Registrando código...');try{const r=await jsonp(API+'?action=alta&barcode='+encodeURIComponent(barcode.value)+'&clave='+encodeURIComponent(clave.value)+'&usuario='+encodeURIComponent(usuario.value));if(r.ok){producto.value=r.producto;altaBox(false);movBox(true);status('✅ Código dado de alta')}else status(r.message,'err')}catch(e){status(e.message,'err')}}
async function registrar(){const p=new URLSearchParams({action:'register',barcode:barcode.value,tipo:tipo.value,cantidad:cantidad.value,usuario:usuario.value,referencia:ref.value,observaciones:obs.value});status('Guardando...');try{const r=await jsonp(API+'?'+p);if(r.ok){status('✅ '+r.producto+' — '+r.tipo+' '+r.cantidad);cantidad.value=1;ref.value='';obs.value='';last=''}else status(r.message,'err')}catch(e){status(e.message,'err')}}
</script></body></html>
