<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Control de Inventario</title>

<style>

body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f3f5f9;
  color:#222
}

.wrap{
  max-width:560px;
  margin:auto;
  padding:16px
}

h1{
  font-size:23px;
  color:#3D558C;
  margin:8px 0 14px
}

.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 2px 10px #0001
}

video{
  width:100%;
  min-height:260px;
  background:#111;
  border-radius:12px;
  object-fit:cover
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#3D558C;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  margin-top:8px
}

button.secondary{background:#666}
button.green{background:#287a3e}
button.red{background:#b3261e}

input,select{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin:5px 0 12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px
}

label{
  font-weight:bold;
  font-size:14px
}

.status{
  padding:11px;
  border-radius:9px;
  margin-top:10px;
  font-size:14px
}

.ok{background:#e4f4e1}
.warn{background:#fff0c7}
.err{background:#f8d7da}

.hidden{display:none}

.small{
  font-size:12px;
  color:#666
}

.scannerInput{
  font-size:22px;
  font-weight:bold;
  text-align:center;
  border:2px solid #3D558C;
  background:#f8faff
}

.producto{
  font-size:18px;
  font-weight:bold
}

.stock{
  text-align:center;
  background:#eef2fa;
  border-radius:12px;
  padding:15px;
  margin:10px 0
}

.stockNumber{
  font-size:36px;
  font-weight:bold;
  color:#3D558C
}

.mode{
  font-size:18px;
  font-weight:bold
}

</style>
</head>

<body>

<div class="wrap">

<h1>📦 CONTROL DE INVENTARIO</h1>


<!-- LECTOR FÍSICO -->

<div class="card">

<label>🔫 LECTOR USB / BLUETOOTH</label>

<input
  id="scannerInput"
  class="scannerInput"
  autocomplete="off"
  placeholder="ESCANEA AQUÍ"
>

<div class="small">
Haz clic aquí una vez y escanea con el lector CHAOAO.
</div>

</div>


<!-- MODO -->

<div class="card">

<label>MODO DE OPERACIÓN</label>

<select id="modo" class="mode">

<option value="CONSULTA">
🔎 CONSULTA
</option>

<option value="ENTRADA">
📥 ENTRADA
</option>

<option value="SALIDA">
📤 SALIDA
</option>

<option value="AJUSTE">
⚙️ AJUSTE
</option>

</select>


<label>Cantidad por escaneo</label>

<input
 id="cantidadRapida"
 type="number"
 min="0.01"
 step="0.01"
 value="1"
>

<label>
<input
 type="checkbox"
 id="automatico"
 style="width:auto"
>
Registrar automáticamente después de escanear
</label>

<div class="small">
Para mayor seguridad, empieza usando el registro automático
desactivado.
</div>

</div>


<!-- CÁMARA -->

<div class="card">

<video id="video" autoplay playsinline muted></video>

<label for="cameraSelect">Cámara</label>

<select id="cameraSelect"></select>

<button id="scanBtn" onclick="startCamera()">
📷 ABRIR CÁMARA
</button>

<button
 id="stopBtn"
 class="secondary hidden"
 onclick="stopCamera()">
DETENER CÁMARA
</button>

<div id="status"></div>

</div>


<!-- PRODUCTO -->

<div class="card">

<label>Código de barras</label>
<input id="barcode" readonly>

<label>Clave</label>
<input id="clave">

<label>Producto</label>
<input id="producto" class="producto" readonly>


<div id="stockBox" class="stock hidden">

<div>EXISTENCIA ACTUAL</div>

<div id="existencia" class="stockNumber">
0
</div>

<div id="estado"></div>

</div>


<!-- ALTA -->

<div id="altaBox" class="hidden">

<div class="status warn">
⚠️ Código nuevo. Captura la CLAVE para relacionarlo.
</div>

<button onclick="alta()">
➕ DAR DE ALTA CÓDIGO
</button>

</div>


<!-- MOVIMIENTO -->

<div id="movBox" class="hidden">

<label>Cantidad</label>

<input
 id="cantidad"
 type="number"
 min="0.01"
 step="0.01"
 value="1"
>

<label>Usuario</label>

<input
 id="usuario"
 placeholder="Nombre"
>

<label>Referencia</label>

<input
 id="referencia"
 placeholder="Ej. compra, venta"
>

<label>Observaciones</label>

<input id="observaciones">

<button onclick="registrar()">
✅ REGISTRAR MOVIMIENTO
</button>

</div>

</div>

</div>


<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

<script>

const API='https://script.google.com/macros/s/AKfycbwQMousq8gdmOt_9ZzKp28NoG5ZLzuoskzGDDif5pBIkIbb6AvtryBPcOaD4x2xIUoZoQ/exec';


let stream=null;
let scanning=false;
let codeReader=null;
let lastCode='';
let scanTimer=null;
let processing=false;


const video=document.getElementById('video');
const cameraSelect=document.getElementById('cameraSelect');
const scannerInput=document.getElementById('scannerInput');


function showStatus(text,cls='ok'){

 document.getElementById('status').innerHTML=
 '<div class="status '+cls+'">'+text+'</div>';

}


function altaBox(show){

 document.getElementById('altaBox')
 .classList.toggle('hidden',!show);

}


function movBox(show){

 document.getElementById('movBox')
 .classList.toggle('hidden',!show);

}


function stockBox(show){

 document.getElementById('stockBox')
 .classList.toggle('hidden',!show);

}


function jsonp(url){

  return new Promise((resolve,reject)=>{

    const callbackName =
      'jsonp_' + Date.now() + '_' + Math.floor(Math.random()*100000);

    const script = document.createElement('script');

    let finished = false;

    const timeout = setTimeout(()=>{

      if(finished) return;

      finished = true;

      cleanup();

      reject(
        new Error('Tiempo de espera agotado al conectar con Apps Script')
      );

    },20000);


    window[callbackName] = function(data){

      if(finished) return;

      finished = true;

      cleanup();

      resolve(data);

    };


    function cleanup(){

      clearTimeout(timeout);

      try{
        delete window[callbackName];
      }catch(e){}

      if(script.parentNode){
        script.parentNode.removeChild(script);
      }

    }


    const separator =
      url.includes('?') ? '&' : '?';

    script.src =
      url +
      separator +
      'callback=' +
      encodeURIComponent(callbackName) +
      '&_=' +
      Date.now();


    script.async = true;


    script.onerror = function(){

      if(finished) return;

      finished = true;

      cleanup();

      reject(
        new Error('No se pudo conectar con Apps Script')
      );

    };


    document.head.appendChild(script);

  });

}
